name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Banco descartável só para a bateria de integração
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: producao_vf_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL_TESTE: postgresql://postgres:postgres@localhost:5432/producao_vf_teste?schema=public
      JWT_SECRET: segredo-de-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes de unidade (sem banco)
        run: npm run test:unidade

      - name: Nomes de modelo e campo batem com o schema
        working-directory: .
        run: node scripts/conferir-campos-prisma.mjs

      - name: Migrações aplicam limpo e batem com o schema
        working-directory: .
        env:
          URL: postgresql://postgres:postgres@localhost:5432/producao_vf_conferencia?schema=public
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database producao_vf_conferencia' || true
          node scripts/conferir-schema.mjs "$URL"

      - name: Testes de integração
        run: npm test

      # A pasta de migrações precisa estar versionada: o Render aplica com
      # `prisma migrate deploy` no start, e sem ela a API sobe com banco vazio.
      - name: Migração versionada
        run: |
          if [ ! -d prisma/migrations ] || [ -z "$(ls -A prisma/migrations)" ]; then
            echo "::error::backend/prisma/migrations está vazio ou não existe."
            echo "Rode ./rodar-local.sh para criar a migração inicial e commite a pasta."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vf
          POSTGRES_PASSWORD: vf
          POSTGRES_DB: producao_vf_e2e
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U vf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vf:vf@localhost:55432/producao_vf_e2e?schema=public
      DIRECT_URL: postgresql://vf:vf@localhost:55432/producao_vf_e2e?schema=public
      JWT_SECRET: segredo-e2e-ci
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
      E2E_URL: http://localhost:5173
      E2E_API: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências (backend, frontend, e2e)
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Banco migrado e semeado
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed

      - name: API e web no ar
        run: |
          (cd backend && npx tsx src/server.ts > /tmp/api.log 2>&1 &)
          (cd frontend && VITE_API_URL=http://localhost:3001 npx vite build && npx vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3001/health >/dev/null && curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3001/health || { cat /tmp/api.log; exit 1; }

      - name: Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Cenários BDD
        working-directory: e2e
        run: npx playwright test

      - name: Relatório e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-relatorio
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
