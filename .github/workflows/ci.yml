name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Banco descartável só para a bateria de integração
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: producao_vf_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL_TESTE: postgresql://postgres:postgres@localhost:5432/producao_vf_teste?schema=public
      JWT_SECRET: segredo-de-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes de unidade (sem banco)
        run: npm run test:unidade

      - name: Testes de integração
        run: npm test

      # A pasta de migrações precisa estar versionada: o Render aplica com
      # `prisma migrate deploy` no start, e sem ela a API sobe com banco vazio.
      - name: Migração versionada
        run: |
          if [ ! -d prisma/migrations ] || [ -z "$(ls -A prisma/migrations)" ]; then
            echo "::error::backend/prisma/migrations está vazio ou não existe."
            echo "Rode ./rodar-local.sh para criar a migração inicial e commite a pasta."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build
