<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale=1: no PWA o zoom por duplo-toque ficava preso entre telas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#BBA58C" />
    <meta name="description" content="Planejamento e acompanhamento da produção do ateliê Vera Flesch Cerâmica." />

    <!--
      As fontes (Unna, a serifada da loja, e Inter no corpo) vêm empacotadas com
      o app, importadas em src/fontes.css — não do CDN do Google. Isso importa
      aqui por três motivos: o app é PWA e precisa abrir igual sem internet no
      ateliê; sem a ida a fonts.gstatic.com o primeiro texto pinta antes; e
      nenhum dado de quem usa sai para um terceiro.
    -->
    <title>Produção Vera Flesch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
